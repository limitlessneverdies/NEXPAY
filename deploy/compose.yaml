services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      MONEY_MODE: test
      DATA_DIR: /state
      HOST: 0.0.0.0
      PORT: 8787
      PUBLIC_ORIGIN: "https://${DOMAIN:?Set DOMAIN in deploy/.env}"
      ENABLE_WEB_WALLET: "false"
    volumes:
      - ledger:/state
      - ./downloads:/app/server/downloads:ro
    expose: ["8787"]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  https:
    image: caddy:2
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN}
      TLS_EMAIL: ${TLS_EMAIL:?Set TLS_EMAIL}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]
volumes:
  ledger:
  caddy_data:
  caddy_config:
